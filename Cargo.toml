[package]
name = "clipmem"
version = "0.1.0"
edition = "2021"
description = "macOS clipboard memory backed by SQLite and searchable from OpenClaw"
license = "MIT"
categories = ["command-line-utilities", "database"]
keywords = ["clipboard", "sqlite", "macos", "cli", "search"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication"] }
