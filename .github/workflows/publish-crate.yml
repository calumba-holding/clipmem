name: Publish crate

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          cargo_toml = pathlib.Path("Cargo.toml")
          version = tomllib.loads(cargo_toml.read_text())["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["EXPECTED_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match Cargo.toml version {expected!r}"
              )
          print(f"validated release tag {actual}")
          PY

      - name: Ensure version is not already published
        run: |
          version="$(python3 - <<'PY'
          import pathlib
          import tomllib
          cargo_toml = pathlib.Path("Cargo.toml")
          print(tomllib.loads(cargo_toml.read_text())["package"]["version"])
          PY
          )"

          status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'User-Agent: clipmem-release-workflow (https://github.com/tristanmanchester/clipmem)' \
              "https://crates.io/api/v1/crates/clipmem/${version}"
          )"
          if [ "${status}" = "200" ]; then
            echo "clipmem ${version} is already published on crates.io" >&2
            exit 1
          fi

          if [ "${status}" != "404" ]; then
            echo "unexpected crates.io response while checking clipmem ${version}: ${status}" >&2
            exit 1
          fi

      - name: Run release verification
        run: |
          cargo test
          cargo publish --dry-run --locked
          cargo package --list

      - name: Publish to crates.io
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --locked

      - name: Fail until trusted publishing or bootstrap secret is configured
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: |
          echo "CARGO_REGISTRY_TOKEN is not configured." >&2
          echo "Use the temporary bootstrap secret for 0.1.0, then migrate this workflow to crates.io Trusted Publishing." >&2
          exit 1
